[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-cli"
version = "0.1.0"
description = "Configurable CSV data-quality gate with JSON and CSV reports"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7"]

[project.scripts]
data-quality = "data_quality.cli:main"
generate-quality-samples = "data_quality.generator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

